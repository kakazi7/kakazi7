<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t">
  <title id="t">Zarpa | KZ — sites, sistemas e ferramentas web</title>
  <style>
    .word { font: 700 104px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -3px; fill: #F2F4F5; }
    .tag { font: 500 24px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 1px; fill: #93A1AA; }
    .kicker { font: 600 15px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 4px; fill: #8FB7C6; }
    .wave { fill: #8FB7C6; }
    .w1 { opacity: 0.14; animation: drift 24s linear infinite; }
    .w2 { opacity: 0.22; animation: drift 17s linear infinite reverse; }
    .w3 { opacity: 0.34; animation: drift 12s linear infinite; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-600px); } }
    @media (prefers-reduced-motion: reduce) { .w1, .w2, .w3 { animation: none; } }
  </style>
