    <path class="wave w2" d="M0 254 Q150 246 300 254 Q450 262 600 254 Q750 246 900 254 Q1050 262 1200 254 Q1350 246 1500 254 Q1650 262 1800 254 Q1950 246 2100 254 Q2250 262 2400 254 L2400 300 L0 300 Z"/>
    <path class="wave w3" d="M0 270 Q150 264 300 270 Q450 276 600 270 Q750 264 900 270 Q1050 276 1200 270 Q1350 264 1500 270 Q1650 276 1800 270 Q1950 264 2100 270 Q2250 276 2400 270 L2400 300 L0 300 Z"/>
